name: Desplegar API en Azure App Service

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un despliegue a la vez: si llega otro cambio, espera a que termine el anterior.
concurrency:
  group: despliegue-azure
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pruebas
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: greensaver_pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pruebas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11 (igual que en Azure)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ejecutar pruebas (unitarias, API, base de datos, sistema y MongoDB)
        env:
          TEST_DATABASE_URL: postgresql://pruebas:pruebas@localhost:5432/greensaver_pruebas
          MONGO_URL_PRUEBAS: mongodb://localhost:27017
        run: pytest -q

      - name: Empaquetar (sin pruebas ni datos de entrenamiento)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          zip -r api.zip app requirements.txt \
            -x "*/__pycache__/*" "*.pyc"

      - name: Publicar en Azure (Azure instala las dependencias al recibir el paquete)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: azure/webapps-deploy@v3
        with:
          app-name: green-saver-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: api.zip
