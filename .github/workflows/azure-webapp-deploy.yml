name: Desplegar API en Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Un despliegue a la vez: si llega otro cambio, espera a que termine el anterior.
concurrency:
  group: despliegue-azure
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11 (igual que en Azure)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: pytest -q

      - name: Empaquetar (sin pruebas ni datos de entrenamiento)
        run: |
          zip -r api.zip app requirements.txt \
            -x "*/__pycache__/*" "*.pyc"

      - name: Publicar en Azure (Azure instala las dependencias al recibir el paquete)
        uses: azure/webapps-deploy@v3
        with:
          app-name: green-saver-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: api.zip
